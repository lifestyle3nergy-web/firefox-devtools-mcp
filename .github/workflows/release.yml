name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit (production, fail on high)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # Integration tests (including the MCP protocol e2e test) need a real
      # Firefox; do not rely on the runner image's preinstalled browser.
      - name: Install Firefox
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: latest

      - name: Test
        run: npm run test:run

      - name: Create archive
        run: tar -czf firefox-devtools-mcp-${{ github.ref_name }}.tar.gz dist package.json README.md LICENSE-APACHE LICENSE-MIT

      - name: Build MCPB bundle
        run: npm run build:mcpb

      # Publishing the release below fires publish.yml (trigger:
      # "release: published"), which runs the npm publishes. Do not also
      # dispatch publish.yml from here - that would run two concurrent
      # "npm publish" calls for the same version.
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            firefox-devtools-mcp-${{ github.ref_name }}.tar.gz \
            dist-mcpb/*.mcpb \
            --generate-notes
