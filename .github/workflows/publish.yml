name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (production, fail on high)
        run: npm audit --omit=dev --audit-level=high

      - name: Run checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build

      # Publishing works with either (in this order of preference):
      # 1. npm trusted publishing (OIDC) - configure in npmjs.com for this
      #    repository (Settings > Integrations > Deploy tokens / Trusted
      #    publishing), no secret needed.
      # 2. An NPM_TOKEN repository secret (npm automation token with publish
      #    rights on the @lifestyle3nergy-web scope).
      - name: Publish main package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            npm publish --access public
          else
            npm publish --access public --provenance
          fi

      - name: Publish moz package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            npm run publish:moz -- --access public
          else
            npm run publish:moz -- --access public --provenance
          fi
