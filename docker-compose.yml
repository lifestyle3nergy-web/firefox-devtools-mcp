services:
  firefox-devtools-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: firefox-devtools-mcp:latest
    container_name: firefox-devtools-mcp
    # The MCP server speaks over stdio: keep stdin open and a TTY so MCP
    # clients (or `docker attach`) can talk to it.
    stdin_open: true
    tty: true
    environment:
      - NODE_ENV=production
      - FIREFOX_HEADLESS=true
      - TOOL_PRESET=basic
      - AUTO_PROFILE=true
      - START_URL=about:blank
      # - DEBUG=firefox-devtools
    volumes:
      # Persist the dedicated Firefox profile and saved outputs
      - firefox-mcp-data:/home/nodejs/.firefox-devtools-mcp
    restart: unless-stopped

volumes:
  firefox-mcp-data:
